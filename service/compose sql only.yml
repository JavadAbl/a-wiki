services:
  # --- Node.js Application ---

  # --- SQL Server Database ---
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server
    environment:
      ACCEPT_EULA: 'Y' # Accept the end-user license agreement
      MSSQL_SA_PASSWORD: '${MSSQL_SA_PASSWORD}'
      MSSQL_PID: 'Express' # Use Express edition (free), or omit for Developer
    ports:
      - '1433:1433' # Expose to host if needed (optional; remove if not required)
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD',
          '/opt/mssql-tools18/bin/sqlcmd',
          '-S',
          'localhost',
          '-U',
          'sa',
          '-P',
          '${MSSQL_SA_PASSWORD}',
          '-C',
          '-Q',
          'SELECT 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s # Give SQL Server time to initialize
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
