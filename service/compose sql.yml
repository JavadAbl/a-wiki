services:
  # --- Node.js Application ---
  app:
    build: .
    # container_name: node_app
    # Load variables from .env file into the container
    env_file:
      - .env
    # Expose 3000 internally to the docker network (not to the host)
    volumes:
      - ./logs:/app/logs
      - ./client:/app:client
    expose:
      - "3000"
    # Health check to verify the app is actually responding
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 10s # Give the app time to boot before checking
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      sqlserver:
        condition: service_healthy # Wait for SQL Server to be ready

  # --- SQL Server Database ---
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server
    environment:
      ACCEPT_EULA: "Y" # Accept the end-user license agreement
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Express" # Use Express edition (free), or omit for Developer
    ports:
      - "1433:1433" # Expose to host if needed (optional; remove if not required)
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD}", "-C", "-Q", "SELECT 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s # Give SQL Server time to initialize
    restart: unless-stopped
    networks:
      - app-network

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:1.31-alpine
    container_name: nginx_proxy
    ports:
      - "80:80" # Expose port 80 to the outside world
    volumes:
      # Mount our custom nginx config into the container
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy # Wait for Node app healthcheck to pass
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
