services:
  # --- Node.js Application ---
  app:
    build: .
    # container_name: node_app
    # Load variables from .env file into the container
    env_file:
      - .env
    # Expose 3000 internally to the docker network (not to the host)
    volumes:
      - ./logs:/app/logs
      - ./client:/app/client
      - ./static:/app/static
    expose:
      - "3000"
    # Health check to verify the app is actually responding
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 10s # Give the app time to boot before checking
    restart: unless-stopped
    networks:
      - app-network

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:1.31-alpine
    container_name: nginx_proxy
    ports:
      - "80:80" # Expose port 80 to the outside world
    volumes:
      # Mount our custom nginx config into the container
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy # Wait for Node app healthcheck to pass
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
